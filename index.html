<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buku Tamu Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
</head>
<body class="bg-[#121212] text-white font-sans min-h-screen pb-12">
    <div class="max-w-md mx-auto p-4">
        <!-- Header -->
        <div class="text-center my-8">
            <h1 class="text-3xl font-serif italic mb-1">Wedding Lina & Sarif</h1>
            <p class="text-sm text-gray-400 tracking-widest">#ARIFallForLINA</p>
        </div>

        <!-- Form Input -->
        <form id="guestForm" class="bg-gray-900 border border-gray-800 p-6 rounded-2xl shadow-xl mb-8 space-y-4">
            <div>
                <label class="block text-sm text-gray-400 mb-1">Nama Anda</label>
                <input type="text" id="name" required class="w-full bg-black border border-gray-700 p-3 rounded-xl focus:outline-none focus:border-blue-500 text-white">
            </div>
            <div>
                <label class="block text-sm text-gray-400 mb-1">Ucapan & Doa</label>
                <textarea id="message" required rows="3" class="w-full bg-black border border-gray-700 p-3 rounded-xl focus:outline-none focus:border-blue-500 text-white"></textarea>
            </div>
            <div>
                <label class="block text-sm text-gray-400 mb-1">Momen Foto</label>
                <input type="file" id="photo" accept="image/*" class="w-full text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:bg-gray-800 file:text-white hover:file:bg-gray-700">
            </div>
            <button type="submit" id="btnSubmit" class="w-full bg-white text-black font-bold py-3 rounded-xl mt-2 hover:bg-gray-200 transition">Kirim Momen</button>
        </form>

        <!-- Galeri -->
        <h2 class="text-lg font-bold mb-4 text-gray-300">Momen Tamu Lainnya</h2>
        <div id="gallery" class="space-y-4"></div>
    </div>

    <script>
        // --- TEMPEL FIREBASE CONFIG KAMU DI SINI ---
        const firebaseConfig = {
  apiKey: "AIzaSyCd_5O4GCfOqJgHTyIyHNZ_wa3T2-pqiAw",
  authDomain: "arifallforlina.firebaseapp.com",
  projectId: "arifallforlina",
  storageBucket: "arifallforlina.firebasestorage.app",
  messagingSenderId: "26928227804",
  appId: "1:26928227804:web:f7efd5ee1d1be7a2addb19",
  measurementId: "G-33L0DDB7X6"
};
        // -------------------------------------------

        // Inisialisasi
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const storage = firebase.storage();

        // Proses Submit Data
        document.getElementById('guestForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            btn.innerText = "Mengunggah...";
            btn.disabled = true;

            const name = document.getElementById('name').value;
            const message = document.getElementById('message').value;
            const file = document.getElementById('photo').files[0];
            let photoUrl = "";

            try {
                if (file) {
                    const storageRef = storage.ref('uploads/' + Date.now() + '_' + file.name);
                    await storageRef.put(file);
                    photoUrl = await storageRef.getDownloadURL();
                }

                await db.collection("guestbook").add({
                    name: name,
                    message: message,
                    photoUrl: photoUrl,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });

                e.target.reset();
                alert("Berhasil dikirim!");
            } catch (error) {
                alert("Gagal mengirim: " + error.message);
            }

            btn.innerText = "Kirim Momen";
            btn.disabled = false;
        });

        // Tampilkan Galeri secara Realtime
        db.collection("guestbook").orderBy("timestamp", "desc").onSnapshot((snapshot) => {
            const gallery = document.getElementById('gallery');
            gallery.innerHTML = '';
            snapshot.forEach((doc) => {
                const data = doc.data();
                gallery.innerHTML += `
                    <div class="bg-gray-900 border border-gray-800 p-4 rounded-xl">
                        <div class="flex justify-between items-center mb-2">
                            <p class="font-bold text-white">${data.name}</p>
                        </div>
                        <p class="text-sm text-gray-300">${data.message}</p>
                        ${data.photoUrl ? `<img src="${data.photoUrl}" class="w-full h-56 object-cover mt-3 rounded-lg border border-gray-700">` : ''}
                    </div>
                `;
            });
        });
    </script>
</body>
</html>
