<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Wedding Celebration - Lina & Sarif</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    
    <!-- Load Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    
    <style>
        :root { 
            --maroon: #6B1D2F; 
            --maroon-dark: #4A1320; 
            --cream: #FAF8F5;
            --gold: #C5A059;
        }
        body { font-family: 'Montserrat', sans-serif; background-color: var(--cream); color: #2C2C2C; }
        .font-serif { font-family: 'Cormorant Garamond', serif; }
        
        .text-maroon { color: var(--maroon); }
        .bg-maroon { background-color: var(--maroon); }
        .border-maroon { border-color: var(--maroon); }
        
        /* Kartu Kaca Mewah */
        .card-luxury {
            background: #FFFFFF;
            border: 1px solid rgba(107, 29, 47, 0.12);
            box-shadow: 0 25px 50px -12px rgba(107, 29, 47, 0.08);
            position: relative;
        }
        
        /* Layout Galeri Masonry */
        .masonry-grid { column-count: 1; column-gap: 1.5rem; }
        @media (min-width: 640px) { .masonry-grid { column-count: 2; } }
        .masonry-item { break-inside: avoid; margin-bottom: 1.5rem; animation: fadeIn 0.8s ease forwards; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Garis Input Elegan */
        .input-luxury {
            background: #FAFAFA;
            border: 1px solid #E5E0DA;
            border-radius: 8px;
            padding: 0.85rem 1rem;
            transition: all 0.3s ease;
        }
        .input-luxury:focus {
            outline: none;
            border-color: var(--maroon);
            box-shadow: 0 0 0 3px rgba(107, 29, 47, 0.05);
            background: #FFFFFF;
        }
    </style>
</head>
<body class="relative min-h-screen pb-20 selection:bg-[#6B1D2F] selection:text-white">
    
    <!-- Garis Aksen Mewah di Atas -->
    <div class="fixed top-0 left-0 w-full h-1.5 bg-gradient-to-r from-[var(--maroon)] via-[var(--gold)] to-[var(--maroon)] z-50"></div>

    <div class="max-w-xl mx-auto px-5 pt-12 sm:pt-16 relative z-10">
        
        <!-- Header Undangan -->
        <div class="text-center mb-12">
            <span class="text-[11px] tracking-[0.4em] uppercase text-[var(--gold)] font-medium block mb-3">The Wedding Celebration of</span>
            <h1 class="text-5xl sm:text-6xl font-serif italic text-maroon font-semibold mb-3">
                Lina & Sarif
            </h1>
            <div class="flex items-center justify-center gap-3 my-4">
                <div class="h-[1px] w-12 bg-[var(--gold)] opacity-60"></div>
                <span class="text-xs tracking-[0.3em] uppercase text-gray-500 font-medium">#ARIFallForLINA</span>
                <div class="h-[1px] w-12 bg-[var(--gold)] opacity-60"></div>
            </div>
        </div>

        <!-- Form Input Kartu Mewah -->
        <form id="guestForm" class="card-luxury p-8 sm:p-10 rounded-2xl mb-16 space-y-6">
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold tracking-wider text-gray-600 uppercase mb-2">Nama Lengkap</label>
                    <input type="text" id="name" required class="w-full input-luxury text-gray-800 text-sm" placeholder="Masukkan nama Anda...">
                </div>
                <div>
                    <label class="block text-xs font-semibold tracking-wider text-gray-600 uppercase mb-2">Ucapan & Doa Restu</label>
                    <textarea id="message" required rows="3" class="w-full input-luxury text-gray-800 text-sm resize-none" placeholder="Tuliskan doa terbaik untuk kedua mempelai..."></textarea>
                </div>
            </div>

            <!-- Bagian Unggah Foto -->
            <div>
                <label class="block text-xs font-semibold tracking-wider text-gray-600 uppercase mb-3 text-center">Bagikan Momen Kebahagiaan</label>
                
                <input type="file" id="photoCamera" accept="image/*" capture="environment" class="hidden" onchange="previewFile('photoCamera')">
                <input type="file" id="photoGallery" accept="image/*" class="hidden" onchange="previewFile('photoGallery')">
                
                <div class="grid grid-cols-2 gap-3">
                    <button type="button" onclick="document.getElementById('photoCamera').click()" class="bg-[#FAF8F5] border border-[var(--maroon)]/20 hover:border-[var(--maroon)] text-maroon py-3.5 px-4 rounded-xl flex items-center justify-center gap-2 transition duration-300 group">
                        <span class="text-lg group-hover:scale-110 transition">📸</span>
                        <span class="text-xs font-semibold tracking-wider uppercase">Kamera</span>
                    </button>
                    <button type="button" onclick="document.getElementById('photoGallery').click()" class="bg-[#FAF8F5] border border-[var(--maroon)]/20 hover:border-[var(--maroon)] text-maroon py-3.5 px-4 rounded-xl flex items-center justify-center gap-2 transition duration-300 group">
                        <span class="text-lg group-hover:scale-110 transition">🖼️</span>
                        <span class="text-xs font-semibold tracking-wider uppercase">Galeri</span>
                    </button>
                </div>
                <div id="file-status" class="hidden mt-3 text-center">
                    <span class="inline-block bg-[var(--maroon)]/10 text-maroon text-[11px] font-medium px-3 py-1 rounded-full">✓ Foto HD siap dibagikan</span>
                </div>
            </div>

            <button type="submit" id="btnSubmit" class="w-full bg-maroon text-white font-medium text-xs tracking-[0.2em] uppercase py-4 rounded-xl shadow-lg hover:bg-[var(--maroon-dark)] transition duration-300 mt-2">
                Kirim Ucapan & Momen
            </button>
        </form>
        
        <!-- Seksi Galeri -->
        <div class="text-center mb-10">
            <h2 class="text-3xl font-serif italic text-maroon">Galeri Momen Tamu</h2>
            <p class="text-xs text-gray-500 tracking-wider mt-1">Kumpulan potret dan doa dari kerabat terkasih</p>
            <div class="w-16 h-[1px] bg-[var(--gold)] mx-auto mt-4 opacity-70"></div>
        </div>

        <div id="gallery" class="masonry-grid"></div>

        <!-- Tombol Gembok Admin (Tanpa Teks Apapun) -->
        <div class="text-center mt-24 pb-6">
            <button onclick="adminLogin()" class="text-gray-300 hover:text-maroon transition text-base opacity-30 hover:opacity-100 focus:outline-none">
                🔒
            </button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCd_5O4GCfOqJgHTyIyHNZ_wa3T2-pqiAw",
            authDomain: "arifallforlina.firebaseapp.com",
            projectId: "arifallforlina",
            messagingSenderId: "26928227804",
            appId: "1:26928227804:web:f7efd5ee1d1be7a2addb19"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let myPosts = JSON.parse(localStorage.getItem('guestbook_my_posts')) || [];
        let isAdmin = localStorage.getItem('guestbook_admin'] === 'sarifarifin1901@gmail.com';
        let selectedFile = null;

        window.previewFile = function(inputId) {
            selectedFile = document.getElementById(inputId).files[0];
            if(selectedFile) {
                document.getElementById('file-status').classList.remove('hidden');
            }
        }

        window.adminLogin = function() {
            if (isAdmin) return;
            const email = prompt("");
            if (email === 'sarifarifin1901@gmail.com') {
                localStorage.setItem('guestbook_admin', email);
                location.reload();
            }
        }

        function compressPhoto(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 1280; 
                        let width = img.width;
                        let height = img.height;

                        if (width > MAX_WIDTH) {
                            height = Math.round((height * MAX_WIDTH) / width);
                            width = MAX_WIDTH;
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        resolve(canvas.toDataURL('image/jpeg', 0.85));
                    };
                };
            });
        }

        document.getElementById('guestForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            btn.innerHTML = "Memproses Momen...";
            btn.disabled = true;

            const name = document.getElementById('name').value;
            const message = document.getElementById('message').value;
            let photoUrl = "";

            try {
                if (selectedFile) {
                    photoUrl = await compressPhoto(selectedFile);
                    
                    if(photoUrl.length > 1048487) { 
                        const img = new Image();
                        img.src = photoUrl;
                        await new Promise(r => img.onload = r);
                        const cvs = document.createElement('canvas');
                        cvs.width = img.width; cvs.height = img.height;
                        cvs.getContext('2d').drawImage(img, 0, 0);
                        photoUrl = cvs.toDataURL('image/jpeg', 0.6);
                    }
                }

                const docRef = await db.collection("guestbook").add({
                    name: name,
                    message: message,
                    photoUrl: photoUrl,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });

                myPosts.push(docRef.id);
                localStorage.setItem('guestbook_my_posts', JSON.stringify(myPosts));

                e.target.reset();
                selectedFile = null;
                document.getElementById('file-status').classList.add('hidden');
            } catch (error) {
                alert("Gagal mengirim: " + error.message);
            }

            btn.innerHTML = "Kirim Ucapan & Momen";
            btn.disabled = false;
        });

        window.deletePost = async function(docId) {
            if (confirm("Hapus momen ini?")) {
                try {
                    await db.collection("guestbook").doc(docId).delete();
                } catch (error) {
                    alert("Gagal menghapus: " + error.message);
                }
            }
        };

        db.collection("guestbook").orderBy("timestamp", "desc").onSnapshot((snapshot) => {
            const gallery = document.getElementById('gallery');
            gallery.innerHTML = '';
            
            snapshot.forEach((doc) => {
                const data = doc.data();
                const docId = doc.id;
                
                const isMyPost = myPosts.includes(docId);
                const canDelete = isMyPost || isAdmin;
                
                const deleteBtnHtml = canDelete 
                    ? `<button onclick="deletePost('${docId}')" class="text-xs text-red-700 bg-red-50 hover:bg-red-100 px-2.5 py-1 rounded-md transition font-medium">Hapus</button>` 
                    : ``;

                gallery.innerHTML += `
                    <div class="masonry-item card-luxury p-5 rounded-xl">
                        <div class="flex justify-between items-start mb-3">
                            <h3 class="font-serif font-bold text-maroon text-lg">${data.name}</h3>
                            ${deleteBtnHtml}
                        </div>
                        <p class="text-sm text-gray-700 leading-relaxed font-light italic mb-4">"${data.message}"</p>
                        ${data.photoUrl ? `<div class="overflow-hidden rounded-lg border border-gray-100"><img src="${data.photoUrl}" class="w-full object-cover hover:scale-105 transition duration-500"></div>` : ''}
                    </div>
                `;
            });
        });
    </script>
</body>
</html>
