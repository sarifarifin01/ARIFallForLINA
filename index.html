<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buku Tamu Digital - Wedding</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Load Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    
    <style>
        :root { --maroon: #722F37; --maroon-dark: #521f25; }
        body { font-family: 'Montserrat', sans-serif; background-color: #FAF9F6; color: #333; }
        .font-serif { font-family: 'Playfair Display', serif; }
        .text-maroon { color: var(--maroon); }
        .bg-maroon { background-color: var(--maroon); }
        .border-maroon { border-color: var(--maroon); }
        
        /* Elemen Kaca & Bayangan Lembut */
        .card-elegant {
            background: #FFFFFF;
            border: 1px solid rgba(114, 47, 55, 0.15);
            box-shadow: 0 20px 40px -15px rgba(114, 47, 55, 0.1);
        }
        
        /* Layout Galeri */
        .masonry-grid { column-count: 1; column-gap: 1.5rem; }
        @media (min-width: 640px) { .masonry-grid { column-count: 2; } }
        .masonry-item { break-inside: avoid; margin-bottom: 1.5rem; }

        /* Input Elegan Minimalis */
        .input-elegant {
            background: transparent;
            border: none;
            border-bottom: 1px solid #d1d5db;
            border-radius: 0;
            padding: 0.75rem 0;
            transition: all 0.3s ease;
        }
        .input-elegant:focus {
            outline: none;
            border-bottom: 2px solid var(--maroon);
        }
    </style>
</head>
<body class="relative min-h-screen pb-12">
    
    <!-- Ornamen Abstrak Latar Belakang -->
    <div class="fixed top-0 left-0 w-full h-2 bg-maroon z-50"></div>
    <div class="fixed top-[-10%] right-[-5%] w-64 h-64 bg-[#722F37] rounded-full mix-blend-multiply filter blur-[100px] opacity-10 z-0 pointer-events-none"></div>

    <div class="max-w-2xl mx-auto p-4 sm:p-6 relative z-10 mt-10">
        
        <!-- Header -->
        <div class="text-center mb-12">
            <p class="text-[10px] sm:text-xs text-gray-500 tracking-[0.4em] uppercase font-semibold mb-3">The Wedding Celebration Of</p>
            <h1 class="text-5xl sm:text-6xl font-serif font-bold text-maroon mb-2">
                Lina & Sarif
            </h1>
            <p class="text-sm sm:text-base text-[#722F37]/70 font-medium tracking-widest mt-4">#ARIFallForLINA</p>
        </div>

        <!-- Form Input -->
        <form id="guestForm" class="card-elegant p-8 sm:p-10 rounded-3xl mb-16 space-y-8 relative overflow-hidden">
            <!-- Dekorasi Sudut -->
            <div class="absolute top-0 right-0 w-16 h-16 border-t-4 border-r-4 border-maroon opacity-20 rounded-tr-3xl"></div>
            
            <div class="space-y-6 relative z-10">
                <div>
                    <label class="block text-xs font-semibold tracking-widest text-maroon uppercase mb-1">Nama Anda</label>
                    <input type="text" id="name" required class="w-full input-elegant text-gray-800 placeholder-gray-300" placeholder="Ketik nama...">
                </div>
                <div>
                    <label class="block text-xs font-semibold tracking-widest text-maroon uppercase mb-1">Ucapan & Doa</label>
                    <textarea id="message" required rows="2" class="w-full input-elegant text-gray-800 placeholder-gray-300 resize-none" placeholder="Tulis harapan baikmu..."></textarea>
                </div>
            </div>

            <!-- Area Unggah Foto HD -->
            <div class="relative z-10">
                <label class="block text-xs font-semibold tracking-widest text-maroon uppercase mb-4 text-center">Bagikan Momen (Foto HD)</label>
                
                <input type="file" id="photoCamera" accept="image/*" capture="environment" class="hidden" onchange="previewFile('photoCamera')">
                <input type="file" id="photoGallery" accept="image/*" class="hidden" onchange="previewFile('photoGallery')">
                
                <div class="flex gap-4">
                    <button type="button" onclick="document.getElementById('photoCamera').click()" class="flex-1 bg-white border border-maroon text-maroon hover:bg-[#722F37] hover:text-white p-3 rounded-xl flex flex-col items-center justify-center gap-1 transition duration-300">
                        <span class="text-xl">📸</span>
                        <span class="text-[10px] font-bold tracking-wider uppercase">Kamera</span>
                    </button>
                    <button type="button" onclick="document.getElementById('photoGallery').click()" class="flex-1 bg-white border border-maroon text-maroon hover:bg-[#722F37] hover:text-white p-3 rounded-xl flex flex-col items-center justify-center gap-1 transition duration-300">
                        <span class="text-xl">📁</span>
                        <span class="text-[10px] font-bold tracking-wider uppercase">Galeri</span>
                    </button>
                </div>
                <p id="file-status" class="text-xs text-maroon text-center font-medium mt-3 hidden">✓ Foto disiapkan</p>
            </div>

            <button type="submit" id="btnSubmit" class="w-full bg-maroon text-white font-semibold text-sm tracking-widest uppercase py-4 rounded-xl mt-4 shadow-lg hover:shadow-xl hover:bg-[#521f25] transition duration-300 relative z-10">
                Kirim Momen
            </button>
        </form>
        
        <!-- Galeri -->
        <div class="text-center mb-8">
            <h2 class="text-2xl font-serif italic text-maroon">Galeri Momen</h2>
            <div class="w-12 h-[1px] bg-maroon mx-auto mt-2"></div>
        </div>

        <div id="gallery" class="masonry-grid"></div>

        <!-- Tombol Rahasia Admin (Hanya Gembok Tanpa Teks) -->
        <div class="text-center mt-20 pb-4">
            <button onclick="adminLogin()" class="text-gray-300 hover:text-maroon transition text-lg opacity-40 hover:opacity-100">
                🔒
            </button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCd_5O4GCfOqJgHTyIyHNZ_wa3T2-pqiAw",
            authDomain: "arifallforlina.firebaseapp.com",
            projectId: "arifallforlina",
            messagingSenderId: "26928227804",
            appId: "1:26928227804:web:f7efd5ee1d1be7a2addb19"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let myPosts = JSON.parse(localStorage.getItem('guestbook_my_posts')) || [];
        let isAdmin = localStorage.getItem('guestbook_admin') === 'sarifarifin1901@gmail.com';
        let selectedFile = null;

        window.previewFile = function(inputId) {
            selectedFile = document.getElementById(inputId).files[0];
            if(selectedFile) {
                document.getElementById('file-status').classList.remove('hidden');
            }
        }

        // Login Admin Tanpa Teks Keterangan
        window.adminLogin = function() {
            if (isAdmin) return;
            const email = prompt(""); // Pop-up kosong tanpa instruksi
            if (email === 'sarifarifin1901@gmail.com') {
                localStorage.setItem('guestbook_admin', email);
                location.reload();
            }
        }

        function compressPhoto(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 1280; 
                        let width = img.width;
                        let height = img.height;

                        if (width > MAX_WIDTH) {
                            height = Math.round((height * MAX_WIDTH) / width);
                            width = MAX_WIDTH;
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        resolve(canvas.toDataURL('image/jpeg', 0.85));
                    };
                };
            });
        }

        document.getElementById('guestForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            btn.innerHTML = "Memproses...";
            btn.disabled = true;

            const name = document.getElementById('name').value;
            const message = document.getElementById('message').value;
            let photoUrl = "";

            try {
                if (selectedFile) {
                    photoUrl = await compressPhoto(selectedFile);
                    
                    if(photoUrl.length > 1048487) { 
                        const img = new Image();
                        img.src = photoUrl;
                        await new Promise(r => img.onload = r);
                        const cvs = document.createElement('canvas');
                        cvs.width = img.width; cvs.height = img.height;
                        cvs.getContext('2d').drawImage(img, 0, 0);
                        photoUrl = cvs.toDataURL('image/jpeg', 0.6);
                    }
                }

                const docRef = await db.collection("guestbook").add({
                    name: name,
                    message: message,
                    photoUrl: photoUrl,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });

                myPosts.push(docRef.id);
                localStorage.setItem('guestbook_my_posts', JSON.stringify(myPosts));

                e.target.reset();
                selectedFile = null;
                document.getElementById('file-status').classList.add('hidden');
            } catch (error) {
                alert("Error: " + error.message);
            }

            btn.innerHTML = "Kirim Momen";
            btn.disabled = false;
        });

        window.deletePost = async function(docId) {
            if (confirm("Hapus?")) {
                try {
                    await db.collection("guestbook").doc(docId).delete();
                } catch (error) {
                    alert("Error: " + error.message);
                }
            }
        };

        db.collection("guestbook").orderBy("timestamp", "desc").onSnapshot((snapshot) => {
            const gallery = document.getElementById('gallery');
            gallery.innerHTML = '';
            
            snapshot.forEach((doc) => {
                const data = doc.data();
                const docId = doc.id;
                
                const isMyPost = myPosts.includes(docId);
                const canDelete = isMyPost || isAdmin;
                
                const deleteBtnHtml = canDelete 
                    ? `<button onclick="deletePost('${docId}')" class="text-xs text-red-700 bg-red-100 hover:bg-red-200 px-2 py-1 rounded transition">✕</button>` 
                    : ``;

                gallery.innerHTML += `
                    <div class="masonry-item card-elegant p-5 rounded-2xl">
                        <div class="flex justify-between items-start mb-3">
                            <p class="font-bold text-maroon text-lg font-serif">${data.name}</p>
                            ${deleteBtnHtml}
                        </div>
                        <p class="text-sm text-gray-700 leading-relaxed font-medium italic mb-4">"${data.message}"</p>
                        ${data.photoUrl ? `<img src="${data.photoUrl}" class="w-full rounded-xl shadow-sm border border-gray-100 object-cover">` : ''}
                    </div>
                `;
            });
        });
    </script>
</body>
</html>
