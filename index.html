<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buku Tamu Digital - Wedding</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Mewah -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    
    <!-- Load Firebase (Hanya Firestore) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #050505; color: #f3f4f6; }
        .font-cinzel { font-family: 'Cinzel', serif; }
        
        /* Animasi Background Mewah */
        .bg-glow {
            position: fixed; width: 50vw; height: 50vw; background: radial-gradient(circle, rgba(212,175,55,0.15) 0%, rgba(0,0,0,0) 70%);
            top: -20%; left: -20%; z-index: -1; animation: float 10s infinite alternate;
        }
        .bg-glow-2 {
            position: fixed; width: 40vw; height: 40vw; background: radial-gradient(circle, rgba(139,92,246,0.1) 0%, rgba(0,0,0,0) 70%);
            bottom: -10%; right: -10%; z-index: -1; animation: float 15s infinite alternate-reverse;
        }
        @keyframes float { 0% { transform: translate(0, 0); } 100% { transform: translate(30px, 50px); } }

        /* Efek Kaca Premium */
        .glass-panel {
            background: rgba(20, 20, 20, 0.6); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(212, 175, 55, 0.2); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* Layout Galeri Pinterest (Masonry) */
        .masonry-grid { column-count: 1; column-gap: 1.5rem; }
        @media (min-width: 640px) { .masonry-grid { column-count: 2; } }
        .masonry-item { break-inside: avoid; margin-bottom: 1.5rem; }
    </style>
</head>
<body class="relative min-h-screen pb-12 overflow-x-hidden">
    
    <!-- Latar Belakang -->
    <div class="bg-glow"></div>
    <div class="bg-glow-2"></div>

    <div class="max-w-3xl mx-auto p-4 sm:p-6 relative z-10 mt-8">
        
        <!-- Header -->
        <div class="text-center mb-12">
            <p class="text-[10px] sm:text-xs text-amber-500 tracking-[0.4em] uppercase font-semibold mb-3">The Wedding Celebration Of</p>
            <h1 class="text-4xl sm:text-6xl font-cinzel font-bold text-transparent bg-clip-text bg-gradient-to-r from-amber-200 via-yellow-500 to-amber-200 mb-2 drop-shadow-lg">
                Lina & Sarif
            </h1>
            <p class="text-sm sm:text-base text-gray-400 font-light tracking-widest mt-4">#ARIFallForLINA</p>
        </div>

        <!-- Form Input -->
        <form id="guestForm" class="glass-panel p-6 sm:p-10 rounded-3xl mb-16 space-y-6">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                <div class="sm:col-span-2">
                    <label class="block text-xs font-semibold tracking-widest text-amber-500/80 uppercase mb-2">Nama Anda</label>
                    <input type="text" id="name" required class="w-full bg-black/60 border border-gray-700 p-4 rounded-xl focus:outline-none focus:border-amber-500 text-white transition placeholder-gray-600" placeholder="Ketik nama...">
                </div>
                <div class="sm:col-span-2">
                    <label class="block text-xs font-semibold tracking-widest text-amber-500/80 uppercase mb-2">Ucapan & Doa</label>
                    <textarea id="message" required rows="3" class="w-full bg-black/60 border border-gray-700 p-4 rounded-xl focus:outline-none focus:border-amber-500 text-white transition placeholder-gray-600" placeholder="Tulis harapan baikmu untuk kami..."></textarea>
                </div>
            </div>

            <!-- Area Unggah Foto HD -->
            <div>
                <label class="block text-xs font-semibold tracking-widest text-amber-500/80 uppercase mb-3">Bagikan Momen (Foto HD)</label>
                
                <!-- Input file disembunyikan, diganti tombol custom -->
                <input type="file" id="photoCamera" accept="image/*" capture="environment" class="hidden" onchange="previewFile('photoCamera')">
                <input type="file" id="photoGallery" accept="image/*" class="hidden" onchange="previewFile('photoGallery')">
                
                <div class="flex gap-3">
                    <button type="button" onclick="document.getElementById('photoCamera').click()" class="flex-1 bg-gray-900 border border-gray-700 hover:border-amber-500/50 text-white p-4 rounded-xl flex items-center justify-center gap-2 transition">
                        📸 <span class="text-sm font-semibold">Buka Kamera</span>
                    </button>
                    <button type="button" onclick="document.getElementById('photoGallery').click()" class="flex-1 bg-gray-900 border border-gray-700 hover:border-amber-500/50 text-white p-4 rounded-xl flex items-center justify-center gap-2 transition">
                        📁 <span class="text-sm font-semibold">Pilih Galeri</span>
                    </button>
                </div>
                <p id="file-status" class="text-xs text-green-400 mt-2 hidden">✓ Foto HD siap dikirim</p>
            </div>

            <button type="submit" id="btnSubmit" class="w-full bg-gradient-to-r from-amber-600 to-yellow-600 text-white font-bold text-sm tracking-widest uppercase py-5 rounded-xl mt-4 hover:shadow-[0_0_20px_rgba(217,171,85,0.4)] transition transform active:scale-[0.98]">
                Bagikan Momen
            </button>
        </form>

        <!-- Garis Pembatas Estetik -->
        <div class="flex items-center justify-center mb-10 opacity-50">
            <div class="h-[1px] w-1/4 bg-gradient-to-r from-transparent to-amber-500"></div>
            <div class="mx-4 text-amber-500 font-cinzel text-xl">✦</div>
            <div class="h-[1px] w-1/4 bg-gradient-to-l from-transparent to-amber-500"></div>
        </div>
        
        <!-- Galeri -->
        <div id="gallery" class="masonry-grid"></div>

        <!-- Tombol Rahasia Admin -->
        <div class="text-center mt-16 pb-8">
            <button onclick="adminLogin()" class="text-gray-700 hover:text-amber-500 transition text-xs tracking-widest flex items-center justify-center gap-2 mx-auto">
                <span class="opacity-50">🔒 Akses Pemilik Acara</span>
            </button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCd_5O4GCfOqJgHTyIyHNZ_wa3T2-pqiAw",
            authDomain: "arifallforlina.firebaseapp.com",
            projectId: "arifallforlina",
            messagingSenderId: "26928227804",
            appId: "1:26928227804:web:f7efd5ee1d1be7a2addb19"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Variabel Penyimpanan
        let myPosts = JSON.parse(localStorage.getItem('guestbook_my_posts')) || [];
        let isAdmin = localStorage.getItem('guestbook_admin') === 'sarifarifin1901@gmail.com';
        let selectedFile = null;

        // Fungsi Notifikasi File Dipilih
        window.previewFile = function(inputId) {
            selectedFile = document.getElementById(inputId).files[0];
            if(selectedFile) {
                document.getElementById('file-status').classList.remove('hidden');
            }
        }

        // Fitur Login Admin (Rahasia)
        window.adminLogin = function() {
            if (isAdmin) {
                alert("Kamu sudah login sebagai Admin. Kamu bisa menghapus foto siapa saja.");
                return;
            }
            const email = prompt("Masukkan Email Pemilik Acara:");
            if (email === 'sarifarifin1901@gmail.com') {
                localStorage.setItem('guestbook_admin', email);
                alert("Akses Pemilik diaktifkan! Semua foto sekarang memunculkan tombol hapus.");
                location.reload();
            } else if (email) {
                alert("Akses ditolak. Email tidak terdaftar.");
            }
        }

        // Kompresi HD (1280px) untuk menjaga kualitas gambar
        function compressPhoto(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        // Kualitas ditingkatkan ke HD (1280px)
                        const MAX_WIDTH = 1280; 
                        let width = img.width;
                        let height = img.height;

                        if (width > MAX_WIDTH) {
                            height = Math.round((height * MAX_WIDTH) / width);
                            width = MAX_WIDTH;
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        // Kualitas render diubah dari 0.6 menjadi 0.85 untuk gambar lebih jernih
                        resolve(canvas.toDataURL('image/jpeg', 0.85));
                    };
                };
            });
        }

        // Proses Submit Form
        document.getElementById('guestForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            btn.innerHTML = "Memproses HD... ⏳";
            btn.disabled = true;

            const name = document.getElementById('name').value;
            const message = document.getElementById('message').value;
            let photoUrl = "";

            try {
                if (selectedFile) {
                    photoUrl = await compressPhoto(selectedFile);
                    
                    // Mencegah file lebih dari 1MB agar database gratis tidak error
                    if(photoUrl.length > 1048487) { 
                        alert("Foto terlalu kompleks. Mengurangi ukuran...");
                        // Otomatis turunkan kualitas sedikit jika file terlalu besar
                        const img = new Image();
                        img.src = photoUrl;
                        await new Promise(r => img.onload = r);
                        const cvs = document.createElement('canvas');
                        cvs.width = img.width; cvs.height = img.height;
                        cvs.getContext('2d').drawImage(img, 0, 0);
                        photoUrl = cvs.toDataURL('image/jpeg', 0.6);
                    }
                }

                const docRef = await db.collection("guestbook").add({
                    name: name,
                    message: message,
                    photoUrl: photoUrl,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });

                myPosts.push(docRef.id);
                localStorage.setItem('guestbook_my_posts', JSON.stringify(myPosts));

                e.target.reset();
                selectedFile = null;
                document.getElementById('file-status').classList.add('hidden');
                alert("Momen ajaib berhasil dikirim!");
            } catch (error) {
                alert("Terjadi kesalahan: " + error.message);
            }

            btn.innerHTML = "Bagikan Momen";
            btn.disabled = false;
        });

        // Fungsi Hapus Postingan
        window.deletePost = async function(docId) {
            if (confirm("Hapus momen ini dari galeri?")) {
                try {
                    await db.collection("guestbook").doc(docId).delete();
                } catch (error) {
                    alert("Gagal menghapus: " + error.message);
                }
            }
        };

        // Render Galeri
        db.collection("guestbook").orderBy("timestamp", "desc").onSnapshot((snapshot) => {
            const gallery = document.getElementById('gallery');
            gallery.innerHTML = '';
            
            snapshot.forEach((doc) => {
                const data = doc.data();
                const docId = doc.id;
                
                // Cek Izin Hapus (Apakah dia pemilik postingan ATAU admin)
                const isMyPost = myPosts.includes(docId);
                const canDelete = isMyPost || isAdmin;
                
                const deleteBtnHtml = canDelete 
                    ? `<button onclick="deletePost('${docId}')" class="text-red-500 hover:text-red-400 bg-red-950/40 px-2 py-1 rounded text-xs transition">Hapus</button>` 
                    : ``;

                gallery.innerHTML += `
                    <div class="masonry-item glass-panel p-5 rounded-2xl">
                        <div class="flex justify-between items-start mb-4">
                            <p class="font-bold text-amber-500 text-lg font-cinzel">${data.name}</p>
                            ${deleteBtnHtml}
                        </div>
                        <p class="text-sm text-gray-200 leading-relaxed font-light mb-4 italic">"${data.message}"</p>
                        ${data.photoUrl ? `<img src="${data.photoUrl}" class="w-full rounded-lg shadow-md border border-gray-700/50 object-cover">` : ''}
                    </div>
                `;
            });
        });
    </script>
</body>
</html>
