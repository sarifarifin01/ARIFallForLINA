<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Live Slideshow Acara</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <style>
        .fade-in { animation: fadeIn 1.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-black text-white h-screen flex flex-col items-center justify-center p-8 overflow-hidden">
    
    <!-- Area Slide -->
    <div id="slide" class="text-center w-full max-w-5xl">
        <h1 class="text-4xl font-serif italic text-gray-500">Menunggu momen pertama...</h1>
    </div>

    <script>
        // --- TEMPEL FIREBASE CONFIG KAMU DI SINI ---
        const firebaseConfig = {
  apiKey: "AIzaSyCd_5O4GCfOqJgHTyIyHNZ_wa3T2-pqiAw",
  authDomain: "arifallforlina.firebaseapp.com",
  projectId: "arifallforlina",
  storageBucket: "arifallforlina.firebasestorage.app",
  messagingSenderId: "26928227804",
  appId: "1:26928227804:web:f7efd5ee1d1be7a2addb19",
  measurementId: "G-33L0DDB7X6"
};
        // -------------------------------------------

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let entries = [];
        let currentIndex = 0;

        // Tarik data realtime
        db.collection("guestbook").orderBy("timestamp", "desc").onSnapshot((snapshot) => {
            entries = [];
            snapshot.forEach((doc) => entries.push(doc.data()));
        });

        // Ganti tampilan tiap 6 detik
        setInterval(() => {
            if (entries.length === 0) return;
            
            const current = entries[currentIndex % entries.length];
            
            // Frame Ala Polaroid
            document.getElementById('slide').innerHTML = `
                <div class="fade-in bg-white text-black p-6 rounded-sm shadow-2xl inline-block transform rotate-1">
                    ${current.photoUrl ? `<img src="${current.photoUrl}" class="max-h-[50vh] min-w-[300px] object-cover mx-auto mb-6 bg-gray-200">` : '<div class="h-10"></div>'}
                    <h2 class="text-3xl font-serif italic mb-2">"${current.message}"</h2>
                    <p class="text-lg font-bold text-gray-500 uppercase tracking-widest">- ${current.name} -</p>
                </div>
            `;
            currentIndex++;
        }, 6000);
    </script>
</body>
</html>
